name: Instalar projeto final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar ZIP
        run: |
          test -f hs-achadinhos-final.zip
          unzip -t hs-achadinhos-final.zip

      - name: Extrair e validar projeto
        run: |
          rm -rf /tmp/hs-final
          mkdir -p /tmp/hs-final

          unzip -q hs-achadinhos-final.zip -d /tmp/hs-final

          test -f /tmp/hs-final/package.json
          test -d /tmp/hs-final/src
          test -d /tmp/hs-final/public
          test -d /tmp/hs-final/supabase
          test -f '/tmp/hs-final/src/app/admin/(panel)/buscas/page.tsx'
          test -f /tmp/hs-final/src/components/SearchInsightsAdmin.tsx

      - name: Substituir projeto antigo
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="hs-achadinhos-final.zip" \
            /tmp/hs-final/ ./

          rm -rf /tmp/hs-final
          rm -f hs-achadinhos-final.zip

      - name: Instalar e testar
        run: |
          npm install
          npm run check

      - name: Publicar projeto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi

          git commit -m "Instalar H&S Achadinhos Final"
          git push origin HEAD:main
