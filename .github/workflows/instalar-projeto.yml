name: Instalar projeto completo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar arquivo ZIP
        run: |
          test -f hs-achadinhos-completo-ajustado.zip
          unzip -t hs-achadinhos-completo-ajustado.zip

      - name: Extrair e validar projeto
        run: |
          rm -rf /tmp/hs-projeto
          mkdir -p /tmp/hs-projeto

          unzip -q hs-achadinhos-completo-ajustado.zip -d /tmp/hs-projeto

          test -f /tmp/hs-projeto/package.json
          test -d /tmp/hs-projeto/src
          test -d /tmp/hs-projeto/public
          test -d /tmp/hs-projeto/supabase
          test -f '/tmp/hs-projeto/src/app/admin/(panel)/buscas/page.tsx'
          test -f /tmp/hs-projeto/src/components/SearchInsightsAdmin.tsx

      - name: Substituir arquivos antigos
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="hs-achadinhos-completo-ajustado.zip" \
            /tmp/hs-projeto/ ./

          rm -rf /tmp/hs-projeto
          rm -f hs-achadinhos-completo-ajustado.zip

      - name: Verificar código
        run: |
          npm install
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Publicar projeto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi

          git commit -m "Instalar projeto completo H&S Achadinhos"
          git push origin HEAD:main
